<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b86b35" />
      <stop offset="50%" stop-color="#874121" />
      <stop offset="100%" stop-color="#5c2f1d" />
    </linearGradient>
  </defs>
  <!-- Ashoka Pillar Capital Stylized Motif -->
  <g fill="url(#emblemGold)" stroke="#5c2f1d" stroke-width="0.75" stroke-linejoin="round">
    <!-- Center Lion -->
    <path d="M50,15 C45,15 42,19 42,25 C42,32 45,36 50,38 C55,36 58,32 58,25 C58,19 55,15 50,15 Z" />
    <circle cx="47" cy="23" r="1.5" fill="#fff" />
    <circle cx="53" cy="23" r="1.5" fill="#fff" />
    <path d="M48,27 Q50,30 52,27" fill="none" stroke="#5c2f1d" stroke-width="1" />
    <!-- Lion Mane left and right -->
    <path d="M42,22 C37,23 34,28 35,35 C36,42 41,47 45,49 L46,39 C43,37 42,32 42,22 Z" />
    <path d="M58,22 C63,23 66,28 65,35 C64,42 59,47 55,49 L54,39 C57,37 58,32 58,22 Z" />
    <!-- Left Lion Profile -->
    <path d="M35,26 C30,27 26,32 26,38 C26,44 30,49 35,51 C33,45 33,35 35,26 Z" />
    <circle cx="30" cy="33" r="1.2" fill="#fff" />
    <!-- Right Lion Profile -->
    <path d="M65,26 C70,27 74,32 74,38 C74,44 70,49 65,51 C67,45 67,35 65,26 Z" />
    <circle cx="70" cy="33" r="1.2" fill="#fff" />
    <!-- Chest & Torso -->
    <path d="M44,48 L56,48 L58,62 L42,62 Z" />
    <!-- Abacus Platform Base -->
    <rect x="20" y="63" width="60" height="9" rx="2" fill="url(#emblemGold)" />
    <!-- Ashoka Chakra on Abacus -->
    <circle cx="50" cy="67.5" r="3.5" fill="#fff" stroke="#1e3a8a" stroke-width="0.8" />
    <circle cx="50" cy="67.5" r="0.8" fill="#1e3a8a" />
    <!-- Galloping Horse left, Bull right stylized shapes -->
    <path d="M32,66 Q35,65 37,68 Q34,69 32,66" fill="#fff" />
    <path d="M68,66 Q65,65 63,68 Q66,69 68,66" fill="#fff" />
    <!-- Lotus Base -->
    <path d="M24,73 C30,83 70,83 76,73 L72,85 C60,90 40,90 28,85 Z" />
    <!-- Plinth Base -->
    <rect x="16" y="87" width="68" height="6" rx="1.5" />
    <rect x="12" y="94" width="76" height="5" rx="1" />
  </g>
  <!-- Satyameva Jayate Inscription Banner -->
  <text x="50" y="109" font-family="'Merriweather', serif" font-size="6.5" font-weight="bold" fill="#6f361f" text-anchor="middle" letter-spacing="1">सत्यमेव जयते</text>
  <text x="50" y="117" font-family="'Inter', sans-serif" font-size="4" font-weight="600" fill="#a35528" text-anchor="middle" letter-spacing="0.5">LEGAL METROLOGY</text>
</svg>
