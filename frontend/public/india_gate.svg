<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b86b35" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#874121" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#5c2f1d" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#deb696" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Sun Glow -->
  <circle cx="200" cy="180" r="140" fill="url(#sunGlow)" />

  <!-- India Gate Architectural Line Art -->
  <g stroke="#874121" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Top Crown Attic -->
    <rect x="140" y="80" width="120" height="18" rx="2" fill="#faf5f0" />
    <rect x="150" y="70" width="100" height="10" rx="1" fill="#f4e8dc" />
    <rect x="175" y="60" width="50" height="10" rx="1" fill="#ebd3be" />
    <circle cx="200" cy="55" r="4" fill="#a35528" />

    <!-- Main Upper Frieze with Inscription box -->
    <rect x="110" y="98" width="180" height="40" fill="#faf5f0" />
    <line x1="120" y1="108" x2="280" y2="108" stroke-dasharray="3,3" stroke-width="1" />
    <line x1="120" y1="128" x2="280" y2="128" stroke-dasharray="3,3" stroke-width="1" />

    <!-- Cornice moulding -->
    <rect x="95" y="138" width="210" height="14" fill="#f4e8dc" />

    <!-- Main Pylons & Central Arch -->
    <!-- Left Pylon -->
    <rect x="105" y="152" width="65" height="170" fill="#faf5f0" />
    <line x1="120" y1="152" x2="120" y2="322" stroke-width="0.8" />
    <line x1="155" y1="152" x2="155" y2="322" stroke-width="0.8" />
    <rect x="115" y="190" width="45" height="70" rx="2" stroke-width="1" />

    <!-- Right Pylon -->
    <rect x="230" y="152" width="65" height="170" fill="#faf5f0" />
    <line x1="245" y1="152" x2="245" y2="322" stroke-width="0.8" />
    <line x1="280" y1="152" x2="280" y2="322" stroke-width="0.8" />
    <rect x="240" y="190" width="45" height="70" rx="2" stroke-width="1" />

    <!-- Central Grand Arch -->
    <path d="M170,322 L170,210 Q170,165 200,165 Q230,165 230,210 L230,322" fill="#fff" stroke-width="2" />
    <path d="M176,322 L176,215 Q176,175 200,175 Q224,175 224,215 L224,322" stroke-dasharray="2,2" stroke-width="1" />

    <!-- Base Plinth & Steps -->
    <rect x="80" y="322" width="240" height="16" fill="#f4e8dc" />
    <rect x="65" y="338" width="270" height="14" fill="#ebd3be" />
    <rect x="50" y="352" width="300" height="12" fill="#deb696" />
    <rect x="35" y="364" width="330" height="10" fill="#ce926a" />

    <!-- Perspective road / plaza grid lines -->
    <line x1="200" y1="374" x2="200" y2="470" stroke="#deb696" stroke-dasharray="4,4" />
    <line x1="170" y1="374" x2="80" y2="470" stroke="#deb696" stroke-width="1" />
    <line x1="230" y1="374" x2="320" y2="470" stroke="#deb696" stroke-width="1" />
    <line x1="140" y1="374" x2="10" y2="470" stroke="#deb696" stroke-width="0.8" />
    <line x1="260" y1="374" x2="390" y2="470" stroke="#deb696" stroke-width="0.8" />
  </g>
</svg>
